services:
  # 1. Backend Service (Python/Django)
  - type: web
    name: backend
    env: python
    buildCommand: "pip install -r requirements.txt && python manage.py collectstatic --noinput"
    startCommand: "gunicorn backend.wsgi:application"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: PYTHON_VERSION
        value: 3.10.12
      - key: ALLOWED_HOSTS
        value: "*"
      - key: DEBUG
        value: "False"

  # 2. Frontend Service (Static Site)
  - type: web
    name: frontend
    env: static
    root: frontend
    buildCommand: "npm install && npm run build"
    publishDir: "dist"
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: backend
          property: url
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

databases:
  - name: db
    plan: free
