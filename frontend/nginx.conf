server {
    listen 80;

    client_max_body_size 20M;

    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /media/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
    
    # Static files for admin (Django admin) if needed, but whitenoise handles it on backend?
    # Whitenoise handles static on backend. So /static/ should theoretically go to backend too if using whitenoise.
    # But usually in prod, we collect static to a volume.
    # However, for simplicity, if backend serves static via whitenoise, we proxy /static/ to backend.
    location /static/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
    }
}
